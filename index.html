<head>
  <meta charset="UTF-8" />

  <meta property="og:site_name" content="Soforth" />
  <meta property="og:title" content="Soforth — A Creative Company for What’s Next." />
  <meta property="og:description" content="A creative company for what’s next." />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/soforth-public.css?v=sf1125b" />
  <script>
    /* Browsers without cross-page view transitions get a short fade instead. */
    if (!("onpagereveal" in window)) document.documentElement.classList.add("no-xvt");
  </script>
  <script type="speculationrules">
    { "prerender": [{ "source": "list", "urls": ["/studio/"], "eagerness": "moderate" }] }
  </script>
</head>
<body class="page-entrance">
  <a class="skip" href="#promise">Skip to the entrance</a>
  <header class="room entrance" id="entrance" aria-labelledby="promise">
    <div class="entrance__main">
      <div class="entrance__copy">
        <p class="wordmark">SOFORTH</p>
        <h1 class="statement" id="promise" tabindex="-1">A Creative Company for What’s Next.</h1>
        <a class="enter" href="/studio/"><span>Enter Soforth</span><span class="enter__arrow" aria-hidden="true">→</span></a>
        <span class="entrance__progress" aria-hidden="true"><i></i></span>
        <p class="sr-live" aria-live="polite" id="entering"></p>
      </div>
      <figure class="entrance__visual" data-brush-area>
        <div class="brushlive brushlive--entrance" data-brush>
          <img src="/images/stroke.webp" width="864" height="392" alt="A single burnt orange brushstroke, painted across bone." fetchpriority="high" />
          <span class="brushlive__sheen" aria-hidden="true"></span>
        </div>
      </figure>
    </div>
  </header>
  <script>
    (function () {
      var root = document.documentElement;
      var body = document.body;
      var enter = document.querySelector(".enter");
      if (!enter) return;
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var noXvt = root.classList.contains("no-xvt");
      var leaving = false;

      function go() {
        if (leaving) return;
        leaving = true;
        if (noXvt && !reduce) {
          body.classList.add("is-leaving");
          window.setTimeout(function () { window.location.href = enter.href; }, 420);
        } else {
          window.location.href = enter.href;
        }
      }

      enter.addEventListener("click", function (event) {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
        if (!noXvt || reduce) return; /* the browser's own transition handles it */
        event.preventDefault();
        go();
      });
      window.addEventListener("pageshow", function () { body.classList.remove("is-leaving"); leaving = false; });

      /* Plays by itself once per visit: SOFORTH, the line, then into the Studio. */
      var seen = false;
      try { seen = window.sessionStorage.getItem("sf-entered") === "1"; window.sessionStorage.setItem("sf-entered", "1"); } catch (e) {}
      if (reduce || seen) return;
      var HOLD = 3200;
      body.style.setProperty("--sf-hold", HOLD + "ms");
      body.classList.add("is-auto");
      var timer = window.setTimeout(function () {
        var live = document.getElementById("entering");
        if (live) live.textContent = "Entering Soforth";
        go();
      }, HOLD);
      /* Anyone who starts using the keyboard keeps the page: no surprise jump. */
      function pause(event) {
        if (event && event.target === enter && event.key === "Enter") return;
        window.clearTimeout(timer);
        body.classList.add("is-paused");
        window.removeEventListener("keydown", pause);
      }
      window.addEventListener("keydown", pause);
    })();
  </script>
  <script src="/js/soforth-brush.js?v=sf1125b" defer></script>
</body>
</html>
